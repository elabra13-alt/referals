# Referals — full stack: PostgreSQL 16, Redis 7, API (migrates on start) and the escrow worker.
#
#   cp .env.example .env    # then fill in WEBHOOK_ENCRYPTION_KEY (and ADMIN_API_TOKEN)
#   docker compose up -d --build
#   curl http://localhost:3000/health
#
# For local development without containers for the app, run only the data stores:
#   docker compose up -d postgres redis && npm run db:migrate && npm run dev

# Shared settings for the two app containers (same image, different commands).
x-app: &app
  build: .
  image: referals-app:latest
  init: true # tini as PID 1: forwards signals, reaps zombies
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
  environment:
    NODE_ENV: production
    # In-network addresses; these override the localhost URLs in .env.
    DATABASE_URL: postgres://${POSTGRES_USER:-referals}:${POSTGRES_PASSWORD:-referals_secret_pass}@postgres:5432/${POSTGRES_DB:-referals_db}
    REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-referals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referals_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-referals_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only: reachable for local tooling, never from other hosts.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-referals} -d ${POSTGRES_DB:-referals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *app
    # Migrate, then `exec` so node (not sh) receives SIGTERM for graceful shutdown.
    command: ["sh", "-c", "node dist/db/migrate.js && exec node dist/server.js"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Only passes once migrations are applied and the server is listening.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Healthy (not just started) guarantees the API has finished running migrations.
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
